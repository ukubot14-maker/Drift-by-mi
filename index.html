<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drift by Ukubot</title><link rel="stylesheet" href="style.css"></head><body>
<div id="hud"><b>DRIFT BY UKUBOT</b><span id="status">Not connected</span><span id="score">Drift: 0</span><button id="settingsBtn" aria-label="Settings" onclick="document.getElementById('settings').classList.remove('hidden')">⚙</button></div>
<canvas id="game"></canvas><div id="settings" class="modal hidden"><h2>Settings</h2><label class="toggle"><input id="joyToggle" type="checkbox" checked> On-screen joystick</label><p class="small">Use the left joystick to steer and accelerate/brake.</p><button id="closeSettings" onclick="document.getElementById('settings').classList.add('hidden')">DONE</button></div><div id="joystick" class="hidden"><div id="joyKnob"></div></div><div id="pedals" class="hidden"><button id="gas">▲ GAS</button><button id="brake">▼ BRAKE</button><button id="handbrake">HAND</button></div><div id="panel"><h1>DRIFT BY UKUBOT</h1><p>Multiplayer street drifting</p><input id="name" maxlength="16" placeholder="Driver name"><button id="join" onclick="document.getElementById('panel').style.display='none';document.getElementById('status').textContent='Driving offline';window.forceDriving=true">START DRIVING</button><input id="peerid" placeholder="Friend's Peer ID (optional)"><button id="connect">CONNECT TO FRIEND</button><p id="myid"></p><p id="help">WASD / arrows · Space handbrake · R reset</p></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script><script src="game.js"></script><script>document.getElementById("join").addEventListener("touchend",function(){document.getElementById("panel").style.display="none";document.getElementById("status").textContent="Driving offline";window.forceDriving=true;},{passive:true});</script></body></html>
